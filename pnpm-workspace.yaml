# pnpm 11 工作区声明：单包仓库，无子包，必须显式给出 packages。
packages: []

# pnpm 11 的构建脚本白名单。
# 注意：pnpm 11.6.0 实际读取的字段是 allowBuilds（map），
# 而不是旧文档里常写的 onlyBuiltDependencies。
# esbuild 的 postinstall 必须运行，否则 VitePress 构建时原生二进制不可用，
# 且 pnpm install 会因"被忽略的构建脚本"而 exit 1，导致 CI 失败。
allowBuilds:
  esbuild: true

# pnpm 11 默认 strictDepBuilds=true，任何未登记构建脚本的依赖都会让 install 直接失败。
# 这里关掉严格模式，仅保留警告，行为与之前 pnpm 9 的部署一致。
strictDepBuilds: false
